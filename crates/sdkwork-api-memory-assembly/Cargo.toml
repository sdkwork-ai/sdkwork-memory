[package]
rust-version.workspace = true
name = "sdkwork-api-memory-assembly"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Generated API assembly for sdkwork-memory application HTTP plane."


[lints]
workspace = true

# Forwarded engine opt-in: default stays PostgreSQL-only so server
# assemblies embedding the memory HTTP plane never link libsqlite3-sys.
# Desktop/local surfaces enable `sqlite` explicitly.
[features]
default = []
sqlite = [
    "sdkwork-intelligence-memory-repository-sqlx/sqlite",
    "sdkwork-memory-drive/sqlite",
]

[lib]
name = "sdkwork_api_memory_assembly"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
sdkwork-web-bootstrap.workspace = true
sdkwork-web-core.workspace = true
tracing.workspace = true
sdkwork-intelligence-memory-service.workspace = true
sdkwork-intelligence-memory-repository-sqlx.workspace = true
sdkwork-database-config.workspace = true
sdkwork-memory-database-host.workspace = true
sdkwork-memory-drive.workspace = true
sdkwork-memory-provider-openai.workspace = true
sdkwork-routes-memory-support.workspace = true
tower = { workspace = true, features = ["limit"] }
sdkwork-routes-memory-app-api.workspace = true
sdkwork-routes-memory-backend-api.workspace = true
sdkwork-routes-memory-open-api.workspace = true
