[package]
rust-version.workspace = true
name = "sdkwork-memory-drive"
version.workspace = true
edition.workspace = true
license.workspace = true


[lints]
workspace = true

# SQLite is a client-local/desktop engine only; server drives stay
# PostgreSQL-backed. The engine is opt-in so embedding assemblies never
# link the SQLite driver unless they declare it.
[features]
default = []
sqlite = ["sqlx/sqlite"]

[dependencies]
async-trait.workspace = true
sdkwork-database-config.workspace = true
sdkwork-database-sqlx.workspace = true
sdkwork-drive-config = { workspace = true }
sdkwork-drive-storage-contract = { workspace = true }
sdkwork-drive-storage-local = { workspace = true }
sdkwork-drive-storage-s3 = { workspace = true }
sdkwork-drive-uploader-service = { workspace = true }
sdkwork-drive-workspace-service = { workspace = true }
sdkwork-memory-spi.workspace = true
sdkwork-utils-rust.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "any", "derive"] }
tracing.workspace = true
