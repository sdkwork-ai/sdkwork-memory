[package]
rust-version.workspace = true
name = "sdkwork-memory-database-host"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "SDKWork Memory database lifecycle bootstrap."


[lints]
workspace = true
[lib]
name = "sdkwork_memory_database_host"
path = "src/lib.rs"

[dependencies]
dotenvy = "0.15"
sdkwork-database-config = { workspace = true }
sdkwork-database-lifecycle = { workspace = true }
sdkwork-database-spi = { workspace = true }
sdkwork-database-sqlx = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
# `engine_admission.rs` builds a SQLite pool purely to prove the module rejects an engine it does
# not declare, so the SQLite pool variant must be available to this test target. The production
# library stays PostgreSQL-only on purpose: the server role rejects the SQLite engine before it
# ever opens a pool.
sdkwork-database-sqlx = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true }
