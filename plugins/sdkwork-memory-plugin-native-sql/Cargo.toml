[package]
rust-version.workspace = true
name = "sdkwork-memory-plugin-native-sql"
edition.workspace = true
version.workspace = true
license.workspace = true


[lints]
workspace = true

# SQLite rides the sqlx Any driver and is a client-local/desktop engine
# only; server stores run on PostgreSQL. Opt-in keeps libsqlite3-sys out of
# server assemblies that embed this plugin.
[features]
default = []
sqlite = ["sqlx/sqlite"]

[dependencies]
async-trait.workspace = true
futures = "0.3"
sdkwork-memory-spi.workspace = true
sdkwork-database-config.workspace = true
sdkwork-database-id.workspace = true
sdkwork-database-sqlx = { workspace = true, features = ["any"] }
serde.workspace = true
serde_json.workspace = true
sdkwork-utils-rust.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio.workspace = true
