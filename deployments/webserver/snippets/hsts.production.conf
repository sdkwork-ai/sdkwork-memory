# HSTS for production TLS virtual hosts.
# The declarative standard has no strictTransportSecurity key yet, so this
# server-scoped raw passthrough is the contract until one lands (see
# SDKWORK_WEBSERVER_SPEC.md raw passthrough rules). max-age MUST stay
# >= 31536000 with includeSubDomains for production edges.
# nginx inheritance note: add_header at server scope is inherited by every
# location that does not declare its own add_header; the gateway-locations
# snippets declare none, so this header reaches all proxied responses.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
