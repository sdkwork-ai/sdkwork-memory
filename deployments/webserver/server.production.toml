cert = "86offer.cn"

# Port 80 in production serves exactly one purpose: a permanent redirect to the
# https URL on the same host and path. $host preserves the original Host header
# and $request_uri preserves path + query, so every production host redirects to
# its own https origin. default_server makes this block the catch-all for any
# unmatched Host on port 80; the wildcard names document the covered zones and
# must stay in sync with the TLS server blocks above.
[[http.server]]
listen = ["80 default_server"]
serverName = ["*.sdkwork.com", "*.birdcoder.com", "*.dtupay.com", "*.noaper.com", "*.sdkwork.cn", "*.birdcoder.cn", "*.dtupay.cn", "*.noaper.cn", "*.skubc.com", "*.skubc.cn", "*.zowalk.com", "*.zowalk.cn", "*.offer86.com", "*.offer86.cn", "*.86offer.com", "*.86offer.cn"]
returnStatus = 301
returnBody = "https://$host$request_uri"

