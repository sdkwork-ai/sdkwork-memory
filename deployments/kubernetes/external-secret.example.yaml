# External Secrets Operator (ESO) example for sdkwork-memory production rollout.
#
# PRODUCTION GUIDANCE: prefer these ExternalSecret manifests over hand-created
# Secrets (secret.example.yaml). The gateway, migration Job, and backup CronJob
# all reference Secrets named sdkwork-memory-database / sdkwork-memory-drive;
# ESO materializes those exact names from your cluster's secret store, so the
# manifests in this directory work unchanged while the values stay in the
# platform secret manager (rotation, audit, and access control included).
#
# Prerequisites:
# - external-secrets.io CRDs installed (this example uses the v1 API).
# - A ClusterSecretStore (or SecretStore) bound to your secret backend
#   (Vault, AWS Secrets Manager, GCP Secret Manager, Azure Key Vault, ...).
#   Replace <cluster-secret-store> and the remoteRef key/property paths with
#   your store's real layout.
# - Values in the store must match the keys consumed by the Deployment:
#   database-url  — unified workspace PostgreSQL connection string
#                   (postgresql://user:pass@host:5432/db?sslmode=require)
#   s3-endpoint / s3-region / s3-bucket / s3-access-key-id /
#   s3-secret-access-key — required only when Drive-backed exports upload
#                   through an S3-compatible object store.
#
# secret.example.yaml remains the fallback for clusters without ESO; do NOT
# apply both management modes for the same Secret name.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sdkwork-memory-database
  labels:
    app.kubernetes.io/name: sdkwork-memory
    app.kubernetes.io/component: database
spec:
  # Reconcile hourly so store-side rotation reaches the materialized Secret.
  refreshInterval: 1h
  secretStoreRef:
    name: <cluster-secret-store>   # your ClusterSecretStore name
    kind: ClusterSecretStore
  target:
    # Must equal the secretKeyRef name used by deployment.yaml,
    # migration-job.yaml, and backup-cronjob.yaml.
    name: sdkwork-memory-database
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: database-url
      remoteRef:
        key: sdkwork/production/memory/database
        property: database-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sdkwork-memory-drive
  labels:
    app.kubernetes.io/name: sdkwork-memory
    app.kubernetes.io/component: drive-export
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: <cluster-secret-store>
    kind: ClusterSecretStore
  target:
    name: sdkwork-memory-drive
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Required only when privacy exports use Drive-backed upload (driveTargetRef).
    - secretKey: s3-endpoint
      remoteRef:
        key: sdkwork/production/memory/drive
        property: s3-endpoint
    - secretKey: s3-region
      remoteRef:
        key: sdkwork/production/memory/drive
        property: s3-region
    - secretKey: s3-bucket
      remoteRef:
        key: sdkwork/production/memory/drive
        property: s3-bucket
    - secretKey: s3-access-key-id
      remoteRef:
        key: sdkwork/production/memory/drive
        property: s3-access-key-id
    - secretKey: s3-secret-access-key
      remoteRef:
        key: sdkwork/production/memory/drive
        property: s3-secret-access-key
