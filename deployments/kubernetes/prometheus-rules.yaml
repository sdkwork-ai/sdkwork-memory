apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sdkwork-api-memory-standalone-gateway
  labels:
    app.kubernetes.io/name: sdkwork-memory
    app.kubernetes.io/component: standalone-gateway
    app.kubernetes.io/part-of: sdkwork-memory
spec:
  groups:
    - name: sdkwork-memory.availability
      rules:
        - alert: MemoryServiceNotServing
          expr: memory_health_status{service="sdkwork-api-memory-standalone-gateway"} == 0
          for: 5m
          labels:
            severity: critical
            service: sdkwork-api-memory-standalone-gateway
          annotations:
            summary: SDKWork Memory API server is not serving
            description: >-
              memory_health_status has been 0 for more than 5 minutes. Check pod
              logs, /readyz, and database connectivity before escalating.
    - name: sdkwork-memory.security
      rules:
        - alert: MemoryAuthzDeniedSpike
          expr: increase(memory_authz_denied_total{service="sdkwork-api-memory-standalone-gateway"}[15m]) > 50
          for: 10m
          labels:
            severity: warning
            service: sdkwork-api-memory-standalone-gateway
          annotations:
            summary: Elevated Memory authorization denials
            description: >-
              Authorization denials exceeded 50 in 15 minutes. Review
              RUNBOOK-tenant-isolation-incident.md and audit logs for abuse or
              misconfigured clients.
        - alert: MemoryQuotaExceededSpike
          expr: increase(memory_quota_exceeded_total{service="sdkwork-api-memory-standalone-gateway"}[15m]) > 20
          for: 10m
          labels:
            severity: warning
            service: sdkwork-api-memory-standalone-gateway
          annotations:
            summary: Memory tenant or space quota rejections are elevated
            description: >-
              Quota rejections exceeded 20 in 15 minutes. Review
              RUNBOOK-rate-limit-quota.md and SDKWORK_MEMORY_MAX_* limits.
    - name: sdkwork-memory.outbox
      rules:
        - alert: MemoryOutboxDeliveryFailures
          expr: increase(memory_outbox_delivery_failed_total{service="sdkwork-api-memory-standalone-gateway"}[15m]) > 0
          for: 15m
          labels:
            severity: warning
            service: sdkwork-api-memory-standalone-gateway
          annotations:
            summary: Memory outbox delivery failures detected
            description: >-
              Outbox delivery or ack failures are increasing. Review
              RUNBOOK-outbox-backlog.md and downstream HTTP/log sinks.
        - alert: MemoryOutboxDeadLetter
          expr: increase(memory_outbox_dead_letter_total{service="sdkwork-api-memory-standalone-gateway"}[5m]) > 0
          for: 1m
          labels:
            severity: critical
            service: sdkwork-api-memory-standalone-gateway
          annotations:
            summary: Memory outbox events moved to dead-letter queue
            description: >-
              Outbox events have exceeded max retries and are now in dead-letter
              state. Inspect failed events in the ai_outbox_event table and
              requeue after fixing downstream issues.
    - name: sdkwork-memory.latency
      rules:
        - alert: MemoryRetrievalP99BudgetBreach
          expr: >-
            histogram_quantile(
              0.99,
              sum by (le) (rate(memory_retrieval_latency_ms_bucket{service="sdkwork-api-memory-standalone-gateway"}[5m]))
            ) > 200
          for: 15m
          labels:
            severity: warning
            service: sdkwork-api-memory-standalone-gateway
          annotations:
            summary: Memory retrieval p99 latency exceeds the 200 ms budget
            description: >-
              Retrieval p99 stayed above the PRD budget of 200 ms for 15 minutes.
              Check retrieval trace queries, database index coverage, and provider
              degradation before escalating.
        - alert: MemoryOutboxDeliveryP99BudgetBreach
          expr: >-
            histogram_quantile(
              0.99,
              sum by (le) (rate(memory_outbox_delivery_latency_ms_bucket{service="sdkwork-api-memory-standalone-gateway"}[5m]))
            ) > 5000
          for: 15m
          labels:
            severity: warning
            service: sdkwork-api-memory-standalone-gateway
          annotations:
            summary: Memory outbox delivery p99 latency is elevated
            description: >-
              Outbox webhook delivery p99 exceeded 5 seconds for 15 minutes, which
              risks lease expiry and duplicate delivery. Check the downstream
              endpoint and RUNBOOK-outbox-backlog.md.
        - alert: MemoryExportPayloadNearHardCap
          expr: >-
            increase(memory_export_payload_bytes_sum{service="sdkwork-api-memory-standalone-gateway"}[15m])
            > 268435456
          for: 1m
          labels:
            severity: warning
            service: sdkwork-api-memory-standalone-gateway
          annotations:
            summary: Memory export payloads near the 256 MiB hard cap
            description: >-
              Export payloads are approaching the absolute 256 MiB cap. Review
              export bounds and consider streaming multipart before raising any
              limits.
    - name: sdkwork-memory.workload-health
      rules:
        # kube-state-metrics required. job_name matches the migration Job in
        # migration-job.yaml (sdkwork-memory-db-migrate) plus the historical
        # sdkwork-memory-migration naming; adjust if the Job is renamed.
        - alert: MemoryMigrationJobFailed
          expr: kube_job_status_failed{job_name=~"sdkwork-memory-(db-migrate|migration).*"} > 0
          for: 0m
          labels:
            severity: critical
            service: sdkwork-api-memory-standalone-gateway
          annotations:
            summary: SDKWork Memory schema migration Job failed
            description: >-
              A sdkwork-memory database migration Job is in failed state. New
              rollouts MUST NOT proceed until the migration completes (runtime
              pods run with SDKWORK_DATABASE_AUTO_MIGRATE=false). Inspect
              `kubectl logs job/sdkwork-memory-db-migrate` and
              RUNBOOK-migration-rollback.md before retrying.
        # Restart storm detection for the gateway pods. The pod regex covers
        # the ReplicaSet suffix; add namespace="<your-namespace>" to scope the
        # rule when the same Prometheus serves multiple namespaces.
        - alert: MemoryGatewayPodRestartStorm
          expr: >-
            increase(kube_pod_container_status_restarts_total{pod=~"sdkwork-api-memory-standalone-gateway(-[0-9a-z]+)*-[0-9a-z]{5}",container="standalone-gateway"}[30m])
            > 3
          for: 5m
          labels:
            severity: warning
            service: sdkwork-api-memory-standalone-gateway
          annotations:
            summary: SDKWork Memory gateway pods are restarting repeatedly
            description: >-
              Gateway containers restarted more than 3 times in 30 minutes,
              which points at crash-looping (failing readiness, OOMKill, or
              database connectivity). Check `kubectl describe pod`, previous
              container logs, and PostgreSQL connection budget headroom
              (replicas x SDKWORK_DATABASE_MAX_CONNECTIONS + reserve <=
              max_connections, see hpa.yaml).
