# Example secrets for sdkwork-memory production rollout.
# Replace placeholder values in your secret manager; do not commit real credentials.
# Unified workspace PostgreSQL identity (ENVIRONMENT_SPEC section 7.1):
# all components share the sdkwork_ai_prod database/schema/user.
---
apiVersion: v1
kind: Secret
metadata:
  name: sdkwork-memory-database
  labels:
    app.kubernetes.io/name: sdkwork-memory
    app.kubernetes.io/component: database
type: Opaque
stringData:
  database-url: postgresql://sdkwork_ai_prod:REPLACE_ME@postgres.database.svc:5432/sdkwork_ai_prod?sslmode=require
---
apiVersion: v1
kind: Secret
metadata:
  name: sdkwork-memory-drive
  labels:
    app.kubernetes.io/name: sdkwork-memory
    app.kubernetes.io/component: drive-export
type: Opaque
stringData:
  # Required when Drive-backed privacy exports are enabled.
  # Drive resolves its PostgreSQL identity from the same SDKWORK_DATABASE_URL as
  # the rest of the process, so it declares no separate database-url key.
  # Production object store (S3-compatible). Omit s3-endpoint for local filesystem exports.
  s3-endpoint: https://s3.example.com
  s3-region: us-east-1
  s3-bucket: memory
  s3-access-key-id: REPLACE_ME
  s3-secret-access-key: REPLACE_ME
