apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-api-memory-standalone-gateway
  labels:
    app.kubernetes.io/name: sdkwork-memory
    app.kubernetes.io/component: standalone-gateway
    app.kubernetes.io/part-of: sdkwork-memory
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sdkwork-memory
      app.kubernetes.io/component: standalone-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdkwork-memory
        app.kubernetes.io/component: standalone-gateway
        app.kubernetes.io/part-of: sdkwork-memory
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sdkwork-memory
                    app.kubernetes.io/component: standalone-gateway
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sdkwork-memory
              app.kubernetes.io/component: standalone-gateway
      containers:
        - name: standalone-gateway
          # Pin by digest in production: replace <release-build-digest> with the actual sha256.
          # Mutable :latest tags MUST NOT be used in production (per RELEASE_SPEC §4.1).
          image: sdkwork-api-memory-standalone-gateway:latest@sha256:<release-build-digest>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SDKWORK_MEMORY_APP_ROOT
              value: /app
            - name: SDKWORK_MEMORY_ENVIRONMENT
              value: production
            - name: SDKWORK_MEMORY_CONFIG_PROFILE
              value: production
            - name: SDKWORK_MEMORY_DEPLOYMENT_PROFILE
              value: cloud
            - name: SDKWORK_MEMORY_RUNTIME_TARGET
              value: container
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SDKWORK_MEMORY_APPLICATION_PUBLIC_INGRESS_BIND
              value: "0.0.0.0:8080"
            # Pod-local admission ceilings; distributed rate limiting and
            # idempotency use the Redis store configured below.
            - name: SDKWORK_MEMORY_MAX_BODY_BYTES
              value: "1048576"
            # Pod-local admission ceiling, sized against the process database
            # budget declared below: admission <= 2 x process pool, so a
            # saturated pod queues on the pool for a bounded time instead of
            # piling 8x more waiters than the pool can ever serve.
            - name: SDKWORK_MEMORY_MAX_CONCURRENCY
              value: "64"
            - name: SDKWORK_MEMORY_HTTP_REQUEST_TIMEOUT_SECS
              value: "30"
            - name: SDKWORK_MEMORY_WEB_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-memory-redis
                  key: redis-url
            - name: SDKWORK_MEMORY_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: sdkwork-memory-runtime
                  key: cors-allowed-origins
            # Process-scoped database budget. DATABASE_SPEC_PROCESS_SHARED_POOL
            # section 5: MAX_CONNECTIONS is a process budget, not a per-module
            # multiplier, and module-prefixed forms (SDKWORK_MEMORY_DATABASE_*,
            # SDKWORK_MEMORY_DB_*) are retired migration inputs that runtime
            # startup MUST NOT read. Capacity planning must satisfy
            #   replicas x SDKWORK_DATABASE_MAX_CONNECTIONS
            #     + admin reserve + operator reserve
            #     <= PostgreSQL max_connections
            # With replicas: 2 this pod declares 32, so the service reserves 64
            # (+reserve). The HPA (hpa.yaml) is capped at maxReplicas: 2 to
            # keep this bound; scale PostgreSQL max_connections FIRST when
            # raising either this value or the HPA ceiling.
            - name: SDKWORK_DATABASE_MAX_CONNECTIONS
              value: "32"
            # Fail pool acquisition well inside SDKWORK_MEMORY_HTTP_REQUEST_TIMEOUT_SECS
            # so contention surfaces as a bounded 503 instead of an expired request.
            - name: SDKWORK_DATABASE_ACQUIRE_TIMEOUT
              value: "10"
            # SDKWORK_MEMORY_SNOWFLAKE_NODE_ID is intentionally NOT set here.
            # The Memory service now uses database-backed node_id allocation
            # via sdkwork_node_registry, which automatically assigns unique
            # node IDs per pod. See DATABASE_SPEC §6.10.
            - name: SDKWORK_DATABASE_AUTO_MIGRATE
              value: "false"
            - name: SDKWORK_MEMORY_OUTBOX_DELIVERY_MODE
              value: http
            - name: SDKWORK_MEMORY_OUTBOX_DELIVERY_CONCURRENCY
              value: "16"
            - name: SDKWORK_MEMORY_OUTBOX_DELIVERY_TIMEOUT_SECS
              value: "10"
            - name: SDKWORK_MEMORY_OUTBOX_LEASE_DURATION_SECS
              value: "30"
            - name: SDKWORK_MEMORY_OUTBOX_DELIVERY_URL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-memory-outbox
                  key: delivery-url
            - name: SDKWORK_MEMORY_JOB_CONCURRENCY
              value: "8"
            - name: SDKWORK_MEMORY_JOB_LEASE_DURATION_SECS
              value: "900"
            - name: SDKWORK_MEMORY_EVAL_CONCURRENCY
              value: "4"
            - name: SDKWORK_MEMORY_EVAL_LEASE_DURATION_SECS
              value: "900"
            - name: SDKWORK_MEMORY_INLINE_EXPORT_MAX_BYTES
              value: "4194304"
            - name: SDKWORK_MEMORY_DRIVE_EXPORT_MAX_BYTES
              value: "67108864"
            # OTLP/HTTP span export. The release image is built with the `otel`
            # feature; the runtime enables OTLP export ONLY when this variable
            # is set to a non-blank value (crates/.../src/observability.rs —
            # there is no separate tracing-enabled switch). The value below is
            # a placeholder: point it at your cluster's actual collector
            # service. The exporter uses the OTLP/HTTP transport
            # (with_http), so port 4318 — NOT the gRPC port 4317. Keep the
            # egress rule for port 4318 in networkpolicy.yaml in sync.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4318
            # Background-plane drain budget. Shutdown is ordered HTTP-first:
            # `axum::serve(..).await` returns after in-flight requests finish,
            # then the runtime drains workers within this budget. Keep the sum of
            # the request timeout above and this budget under
            # terminationGracePeriodSeconds so the process reports an incomplete
            # drain itself instead of being killed mid-write. Work that outlives
            # the budget keeps its database lease and is re-claimed by a peer.
            - name: SDKWORK_MEMORY_SHUTDOWN_DRAIN_SECS
              value: "25"
            # One unified workspace database identity for the whole process.
            # DATABASE_SPEC_PROCESS_SHARED_POOL section 6: modules integrated
            # into one process MUST resolve the same database and schema, and
            # runtime startup validates one normalized identity and fails on any
            # application- or module-prefixed database key. The Memory service,
            # the embedded IAM readiness/audit plane, and the Drive-backed
            # export adapter therefore share this single URL and its pool.
            - name: SDKWORK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-memory-database
                  key: database-url
            # Drive-backed export upload (optional; enable when privacy exports use driveTargetRef).
            - name: SDKWORK_MEMORY_DRIVE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: sdkwork-memory-drive
                  key: s3-endpoint
                  optional: true
            - name: SDKWORK_MEMORY_DRIVE_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: sdkwork-memory-drive
                  key: s3-region
                  optional: true
            - name: SDKWORK_MEMORY_DRIVE_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: sdkwork-memory-drive
                  key: s3-bucket
                  optional: true
            - name: SDKWORK_DRIVE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sdkwork-memory-drive
                  key: s3-access-key-id
                  optional: true
            - name: SDKWORK_DRIVE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sdkwork-memory-drive
                  key: s3-secret-access-key
                  optional: true
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}
      # Bounds the whole shutdown: HTTP drain (request timeout above) plus the
      # SDKWORK_MEMORY_SHUTDOWN_DRAIN_SECS background budget.
      terminationGracePeriodSeconds: 60
