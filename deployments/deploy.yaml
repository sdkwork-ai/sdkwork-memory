version: 2
defaultProfile: cloud.production
profiles:
  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: mem.sdkwork.com
        tls: sdkwork.com
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-admin.sdkwork.com
          - memory-app.sdkwork.com
          - memory-open.sdkwork.com
          - memory.sdkwork.com
      - domain: memory-admin.birdcoder.com
        tls: birdcoder.com
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-app.birdcoder.com
          - memory-open.birdcoder.com
          - memory.birdcoder.com
      - domain: memory-admin.dtupay.com
        tls: dtupay.com
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-app.dtupay.com
          - memory-open.dtupay.com
          - memory.dtupay.com
      - domain: memory-admin.noaper.com
        tls: noaper.com
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-app.noaper.com
          - memory-open.noaper.com
