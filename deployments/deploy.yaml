version: 2
defaultProfile: cloud.production
profiles:
  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: mem.sdkwork.com
        tls: sdkwork.com
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-admin.sdkwork.com
          - memory-app.sdkwork.com
          - memory-open.sdkwork.com
          - memory.sdkwork.com
      - domain: memory-admin.birdcoder.com
        tls: birdcoder.com
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-app.birdcoder.com
          - memory-open.birdcoder.com
          - memory.birdcoder.com
      - domain: memory-admin.dtupay.com
        tls: dtupay.com
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-app.dtupay.com
          - memory-open.dtupay.com
          - memory.dtupay.com
      - domain: memory-admin.sdkwork.cn
        tls: sdkwork.cn
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-app.sdkwork.cn
          - memory-open.sdkwork.cn
          - memory.sdkwork.cn
      - domain: memory-admin.birdcoder.cn
        tls: birdcoder.cn
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-app.birdcoder.cn
          - memory-open.birdcoder.cn
          - memory.birdcoder.cn
      - domain: memory-admin.dtupay.cn
        tls: dtupay.cn
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-app.dtupay.cn
          - memory-open.dtupay.cn
          - memory.dtupay.cn
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.production
        env: etc/topology/cloud.production.env
      kubernetes:
        reference: deployments/kubernetes/
      proxy:
        upstreams:
          application.public-ingress: http://127.0.0.1:8080
          platform.api-gateway: http://127.0.0.1:3900
      nginx:
        clientMaxBodySize: 32m
  standalone.production:
    deployment:
      deploymentProfile: standalone
      environment: production
      deliveryKind: host-package
      deploymentDriver: nginx
      managementModel: customer-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: private
      rolloutStrategy: recreate
      availabilityMode: single-instance
    install:
      layout: binary-package
    expose:
      - domain: mem.sdkwork.com
        tls: sdkwork.com
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-admin.sdkwork.com
          - memory-app.sdkwork.com
          - memory-open.sdkwork.com
          - memory.sdkwork.com
      - domain: memory-admin.birdcoder.com
        tls: birdcoder.com
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-app.birdcoder.com
          - memory-open.birdcoder.com
          - memory.birdcoder.com
      - domain: memory-admin.dtupay.com
        tls: dtupay.com
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-app.dtupay.com
          - memory-open.dtupay.com
          - memory.dtupay.com
      - domain: memory-admin.sdkwork.cn
        tls: sdkwork.cn
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-app.sdkwork.cn
          - memory-open.sdkwork.cn
          - memory.sdkwork.cn
      - domain: memory-admin.birdcoder.cn
        tls: birdcoder.cn
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-app.birdcoder.cn
          - memory-open.birdcoder.cn
          - memory.birdcoder.cn
      - domain: memory-admin.dtupay.cn
        tls: dtupay.cn
        mode: api
        apiPathStyle: full-prefix
        aliases:
          - memory-app.dtupay.cn
          - memory-open.dtupay.cn
          - memory.dtupay.cn
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: standalone.production
        env: etc/topology/standalone.production.env
      proxy:
        upstreams:
          application.public-ingress: http://127.0.0.1:8080
          application.backend-http: http://127.0.0.1:8080
          application.open-http: http://127.0.0.1:8080
          application.app-http: http://127.0.0.1:8080
          platform.api-gateway: http://127.0.0.1:3900
      nginx:
        clientMaxBodySize: 32m
